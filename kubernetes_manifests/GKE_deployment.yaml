apiVersion: apps/v1
kind: Deployment
metadata:
  name: xox-game
  namespace: production
  labels:
    app.kubernetes.io/name: xox-game
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: github-actions
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          
      maxUnavailable: 0    
  selector:
    matchLabels:
      app: xox-game
  template:
    metadata:
      labels:
        app: xox-game
    spec:
      containers:
      - name: xox-game
        image: parellishyamsunder/xox-game:latest # Update this if migrating to Google Artifact Registry
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20

        resources:
          requests:
            memory: "32Mi"
            cpu: "100m"
          limits:
            memory: "64Mi"
            cpu: "200m"

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xox-game-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xox-game
  minReplicas: 2 
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75 

---

apiVersion: v1
kind: Service
metadata:
  name: xox-game-service
  namespace: production
  labels:
    app.kubernetes.io/name: xox-game
  annotations:
    # This enables Container-Native Load Balancing in GKE. 
    # It routes traffic directly from the Google Cloud Load Balancer to your Pod IPs,
    # mimicking the 'target-type: ip' behavior you had in AWS.
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP 
  selector:
    app: xox-game
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xox-game-ingress
  namespace: production
spec:
  # Changed from 'alb' to Google's external HTTP(S) load balancer
  ingressClassName: gce 
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xox-game-service
                port:
                  number: 80
